name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify tag matches Cargo.toml
        id: metadata
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "micro-wakeword" }
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$expectedTag'."
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build crates.io package
        run: cargo package --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $crate = Join-Path $env:RUNNER_TEMP "package-target\package\micro-wakeword-$env:CRATE_VERSION.crate"
          gh release create $env:GITHUB_REF_NAME $crate --verify-tag --generate-notes --title "micro-wakeword $env:CRATE_VERSION"
