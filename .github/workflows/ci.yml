name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handbook:
    name: Handbook build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  quality:
    name: Windows quality checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target

  msrv:
    name: Rust 1.85 compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets --all-features

  platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            runner: windows-latest
          - name: Linux x86-64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux audio development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features
      - run: cargo check --locked --all-targets --no-default-features
      - name: Load the bundled TensorFlow Lite runtime
        run: cargo test --locked --no-default-features --lib runtime::tests::bundled_runtime_loads_all_required_symbols
      - name: Download pinned inference test model
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "micro-wakeword-test-model"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $base = "https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/2a187129da6735aa05385f3fe360941931cb7cc3/microWakeWordsV3"
          Invoke-WebRequest "$base/miku.json" -OutFile "$directory/miku.json"
          Invoke-WebRequest "$base/miku.tflite" -OutFile "$directory/miku.tflite"
          $jsonHash = (Get-FileHash "$directory/miku.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          $modelHash = (Get-FileHash "$directory/miku.tflite" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($jsonHash -ne "f8e73a893ea2efb1e3954fc5e9b6724a27721a19526fff1448b187fb7708a36a") {
            throw "Unexpected test JSON checksum: $jsonHash"
          }
          if ($modelHash -ne "83882f73f9d0c228e085bf4ce6e71a07871545638598fa1962a3c91ccdde521b") {
            throw "Unexpected test model checksum: $modelHash"
          }
      - name: Run real model inference with the bundled runtime
        run: cargo test --locked --no-default-features --test inference
        env:
          MICRO_WAKEWORD_TEST_CONFIG: ${{ runner.temp }}/micro-wakeword-test-model/miku.json

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  semver:
    name: Public API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux audio development files
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}

  coverage:
    name: Test coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
